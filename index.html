<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mics — Modern Music Experience</title>
    <meta name="description" content="Minimalist, High-Fidelity Music Streaming Player"/>
    <meta name="theme-color" content="#090b0e"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <!-- Theme Initialization Script (Prevent Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('mics_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Plus Jakarta Sans (Headings/Display) + Inter (Body/UI) + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "bg-base": "var(--bg-base)",
                        "bg-nav": "var(--bg-nav)",
                        "bg-elevated": "var(--bg-elevated)",
                        "bg-player": "var(--bg-player)",
                        "bg-input": "var(--bg-input)",
                        "bg-overlay": "var(--bg-overlay)",

                        "surface": "var(--surface)",
                        "surface-dim": "var(--surface-dim)",
                        "surface-bright": "var(--surface-bright)",
                        "surface-variant": "var(--surface-variant)",
                        "surface-container-lowest": "var(--surface-container-lowest)",
                        "surface-container-low": "var(--surface-container-low)",
                        "surface-container": "var(--surface-container)",
                        "surface-container-high": "var(--surface-container-high)",
                        "surface-container-highest": "var(--surface-container-highest)",

                        "text-primary": "var(--text-primary)",

                        "text-tertiary": "var(--text-tertiary)",

                        "secondary": "var(--secondary)",

                        "outline": "var(--outline)",

                        "accent": "var(--accent)"

                        "xl": "1rem",
                        "2xl": "1.25rem",

                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "stack-sm": "8px",

                        "display-lg": ["Plus Jakarta Sans", "system-ui", "sans-serif"]
                    },
                    fontSize: {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],

  <body class="bg-bg-base text-text-primary transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
