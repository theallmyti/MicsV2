services:
  mics:
    build: .
    container_name: mics-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - STREAM_API_URL=${STREAM_API_URL:-}
      - STREAM_API_KEY=${STREAM_API_KEY:-}
      - STREAM_API_HEADER=${STREAM_API_HEADER:-x-api-key}
      - YTDLP_PROXY=${YTDLP_PROXY:-}
      - YTDLP_COOKIES=${YTDLP_COOKIES:-}
    volumes:
      - ./cache:/app/cache

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mics-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://mics:3001
    depends_on:
      - mics
